<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Khanismita Order Extractor — Settings</title>
    <style>
      body { font-family: system-ui, sans-serif; width: 360px; padding: 16px; background: #0f1115; color: #e8e8ea; }
      h1 { font-size: 15px; margin: 0 0 12px; }
      label { display: block; font-size: 12px; margin: 10px 0 4px; color: #a5a8b3; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px; border: 1px solid #2a2e38; background: #171a21; color: #e8e8ea; font-size: 13px; }
      button { margin-top: 14px; width: 100%; padding: 9px; border: 0; border-radius: 6px; background: #16a34a; color: #fff; font-weight: 600; cursor: pointer; }
      .muted { font-size: 11px; color: #7c808c; margin-top: 10px; line-height: 1.5; }
      #status { font-size: 12px; color: #16a34a; margin-top: 8px; min-height: 16px; }
    </style>
  </head>
  <body>
    <h1>Khanismita Order Extractor</h1>

    <label>Gemini API key</label>
    <input id="geminiKey" type="password" placeholder="AIza..." />

    <label>Gemini model</label>
    <input id="model" placeholder="gemini-2.5-flash" />

    <label>Supabase URL</label>
    <input id="supabaseUrl" placeholder="https://xxxx.supabase.co" />

    <label>Supabase anon key</label>
    <input id="supabaseKey" type="password" placeholder="eyJ..." />

    <label>Lookback window (minutes)</label>
    <input id="lookback" type="number" placeholder="20" />

    <button id="save">Save settings</button>
    <div id="status"></div>
    <p class="muted">Open a chat in WhatsApp Web and click the floating 🍛 button to build an order.</p>

    <script src="options.js"></script>
  </body>
</html>
